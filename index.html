<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trelob studio</title>
    <meta name="description" content="Support, privacy, and terms for apps from trelob studio." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f1ea;
        --text: #1f1f1f;
        --muted: #5c5c5c;
        --line: #d8d0c6;
        --accent: #2f6fad;
        --card: #fffdf9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161b23;
          --text: #e8edf3;
          --muted: #9aa6b4;
          --line: #2d3642;
          --accent: #7eb4e6;
          --card: #1d2430;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 0.35rem; }
      .meta { color: var(--muted); margin: 0 0 2rem; }
      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.15rem 1.2rem 1.25rem;
      }
      article h2 { font-size: 1.15rem; margin: 0 0 0.35rem; }
      article p { margin: 0 0 0.85rem; }
      .links { display: flex; flex-wrap: wrap; gap: 0.75rem 1.1rem; }
      a { color: var(--accent); }
      footer {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>trelob studio</h1>
      <p class="meta">App support, privacy policies, and terms of use.</p>

      <article>
        <h2>Sudoku</h2>
        <p>A free, offline Sudoku game for iPhone and iPad. No ads, no in-app purchases, no account.</p>
        <div class="links">
          <a href="sudoku/support.html">Support</a>
          <a href="sudoku/privacy.html">Privacy Policy</a>
          <a href="sudoku/terms.html">Terms of Use</a>
        </div>
      </article>

      <footer>© 2026 trelob studio</footer>
    </main>
  </body>
</html>
